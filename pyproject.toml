[project]
name = "wattsit-dev"
version = "0.1.0"
description = "Personal website for William Watts"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "markdown>=3.10.3",
    "pygments>=2.20.0",
    "python-frontmatter>=1.3.0",
]

[tool.fastapi]
entrypoint = "src.main:app"

[dependency-groups]
dev = [
    "black>=26.5.1",
]
