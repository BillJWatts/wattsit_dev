<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}William Watts | Dev Blog & Portfolio{% endblock %}</title>
    <meta name="description" content="Personal website, developer blog, and project portfolio for William Watts.">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/src/static/favicon.svg">
    <link rel="alternate icon" type="image/png" href="/src/static/favicon.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="/src/static/styles.css">
    {% block extra_head %}{% endblock %}
</head>

<body>
    <!-- Retro Minimal Header -->
    <header class="header">
        <div class="header-container">
            <a href="/" class="brand-logo">
                <span class="prompt-symbol">$</span>
                <span class="brand-text">~/wattsit.dev</span>
            </a>

            <nav aria-label="Primary navigation">
                <ul class="nav-links">
                    <li>
                        <a href="/" class="nav-link {% if active_page == 'home' %}active{% endif %}">Home</a>
                    </li>
                    <li>
                        <a href="/about" class="nav-link {% if active_page == 'about' %}active{% endif %}">About</a>
                    </li>
                    <li>
                        <a href="/projects"
                            class="nav-link {% if active_page == 'projects' %}active{% endif %}">Projects</a>
                    </li>
                    <li>
                        <a href="/blog" class="nav-link {% if active_page == 'blog' %}active{% endif %}">Dev Blog</a>
                    </li>
                </ul>
            </nav>

            <div class="social-nav">
                <a href="https://www.linkedin.com/in/billjwatts/" target="_blank" rel="noopener noreferrer"
                    class="social-icon-btn">
                    <span>[LinkedIn]</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2026 William Watts</p>
            <p>Python &amp; FastAPI</p>
        </div>
    </footer>
</body>

</html>
